<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Рассылка{% endblock %}</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#6b7280; --line:#e5e7eb; --accent:#1f5fbf;
          --ok:#15803d; --bad:#b91c1c; --warn:#b45309; --chip:#eef2f7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171c; --card:#1c2027; --text:#e6e8eb; --muted:#9aa3ae;
          --line:#2c323b; --accent:#6aa3ff; --ok:#4ade80; --bad:#f87171; --warn:#fbbf24; --chip:#262c35; } }
  * { box-sizing:border-box }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text) }
  header { background:var(--card); border-bottom:1px solid var(--line) }
  header .in, main { max-width:1100px; margin:0 auto; padding:12px 16px }
  header .in { display:flex; gap:20px; align-items:center; flex-wrap:wrap }
  header b { font-size:17px } header a { color:var(--muted); text-decoration:none } header a.on, header a:hover { color:var(--accent) }
  h1 { font-size:22px; margin:12px 0 16px } h2 { font-size:17px; margin:24px 0 10px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px }
  .stat .n { font-size:26px; font-weight:600 } .stat .l { color:var(--muted); font-size:13px }
  table { width:100%; border-collapse:collapse; font-size:14px }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top }
  th { color:var(--muted); font-weight:500 }
  .scroll { overflow-x:auto }
  .chip { display:inline-block; padding:1px 8px; border-radius:999px; background:var(--chip); font-size:12px; margin:1px 2px; white-space:nowrap }
  .ok { color:var(--ok) } .bad { color:var(--bad) } .warn { color:var(--warn) } .muted { color:var(--muted) }
  button, .btn { display:inline-block; border:0; border-radius:8px; padding:8px 14px; background:var(--accent); color:#fff;
                 font:inherit; cursor:pointer; text-decoration:none }
  .btn.light, button.light { background:var(--chip); color:var(--text) }
  input[type=text], textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); font:inherit }
  textarea { min-height:220px; resize:vertical }
  label.ch { display:flex; gap:8px; align-items:center; padding:6px 0 }
  .note { background:var(--chip); border-radius:8px; padding:10px 12px; font-size:14px }
  .preview { white-space:pre-wrap; border-left:3px solid var(--accent); padding:8px 12px; background:var(--chip); border-radius:6px }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center }
</style>
</head>
<body>
<header><div class="in">
  <b>📨 Рассылка</b>
  <a href="/" class="{{ 'on' if request.url.path == '/' }}">Клиенты</a>
  <a href="/new" class="{{ 'on' if request.url.path == '/new' }}">Новая рассылка</a>
  <a href="/campaigns" class="{{ 'on' if request.url.path.startswith('/campaigns') }}">Рассылки</a>
</div></header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
