<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отписка от рассылки</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --accent:#1f5fbf }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171c; --card:#1c2027; --text:#e6e8eb; --accent:#6aa3ff } }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,sans-serif; display:flex; min-height:100vh; align-items:center; justify-content:center; padding:16px }
  .card { background:var(--card); border-radius:12px; padding:28px; max-width:420px; text-align:center }
  button { border:0; border-radius:8px; padding:10px 18px; background:var(--accent); color:#fff; font:inherit; cursor:pointer }
</style></head>
<body><div class="card">
{% if done %}
  {% if name %}<p>Готово. Вы больше не будете получать эти письма.</p>{% else %}<p>Ссылка недействительна.</p>{% endif %}
{% else %}
  <p>Отписаться от рассылки по электронной почте?</p>
  <form method="post"><button>Отписаться</button></form>
{% endif %}
</div></body></html>
